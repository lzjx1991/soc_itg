[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-itg"
version = "0.1.0"
description = "SoC integration tool: assemble IP-XACT into top RTL / CSR / SDC / filelists"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
soc-itg = "soc_itg.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_itg"]
